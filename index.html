
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 첫 웹사이트</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
            text-align: center;
        }

        header {
            background-color: #333;
            color: white;
            padding: 20px;
        }

        main {
            padding: 50px 20px;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        footer {
            padding: 20px;
            color: #777;
        }
    </style>
</head>

<body>

    <header>
        <h1>나의 웹사이트</h1>
    </header>

    <main>
        <h2>안녕하세요!</h2>
        <p>최원석입니다.</p>

        <button onclick="hello()">
            클릭하기
        </button>
    </main>

    <footer>
        <p>© 2026 My Website</p>
    </footer>

    <script>
        function hello() {
            alert("버튼을 클릭했습니다!");
        }
    </script>

</body>
</html>

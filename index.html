<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 첫 웹사이트</title>

    <script>
        // 깜빡임 방지: 화면 그리기 전에 저장된 테마 적용
        (function () {
            var saved = null;
            try { saved = localStorage.getItem("theme"); } catch (e) {}
            var theme = saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
            document.documentElement.setAttribute("data-theme", theme);
        })();
    </script>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --bg: #f4f4f4;
            --text: #333;
            --header-bg: #333;
            --header-text: #fff;
            --footer-text: #777;
            --btn-bg: #007bff;
            --btn-hover: #0056b3;
        }

        [data-theme="dark"] {
            --bg: #121212;
            --text: #e6e6e6;
            --header-bg: #1f1f1f;
            --header-text: #fff;
            --footer-text: #999;
            --btn-bg: #3d8bfd;
            --btn-hover: #6ea8fe;
            --card-bg: #1e1e1e;
            --input-bg: #2a2a2a;
            --input-border: #444;
            --success: #75b798;
            --error: #ea868f;
        }

        :root:not([data-theme="dark"]) {
            --card-bg: #fff;
            --input-bg: #fff;
            --input-border: #ccc;
            --success: #198754;
            --error: #dc3545;
        }

        .contact {
            max-width: 480px;
            margin: 60px auto 0;
            padding: 28px 24px;
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            text-align: left;
        }

        .contact h2 {
            margin-top: 0;
            text-align: center;
        }

        .contact .desc {
            text-align: center;
            margin-top: -8px;
            color: var(--footer-text);
        }

        .contact label {
            display: block;
            margin: 16px 0 6px;
            font-weight: bold;
            font-size: 14px;
        }

        .contact input,
        .contact textarea {
            width: 100%;
            padding: 10px 12px;
            font-size: 15px;
            font-family: inherit;
            color: var(--text);
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 8px;
        }

        .contact input:focus,
        .contact textarea:focus {
            outline: 2px solid var(--btn-bg);
            outline-offset: 1px;
        }

        .contact textarea {
            min-height: 120px;
            resize: vertical;
        }

        .contact button[type="submit"] {
            width: 100%;
            margin-top: 20px;
            font-size: 16px;
        }

        .contact button[disabled] {
            opacity: 0.6;
            cursor: wait;
        }

        .form-status {
            margin: 14px 0 0;
            text-align: center;
            font-size: 14px;
            min-height: 1.2em;
        }

        .form-status.success { color: var(--success); }
        .form-status.error { color: var(--error); }

        .hp { position: absolute; left: -9999px; }


        /* ===== AI 추천 ===== */
        .recommend {
            max-width: 720px;
            margin: 60px auto 0;
            padding: 28px 24px;
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        }

        .recommend h2 { margin-top: 0; }

        .recommend .desc {
            margin-top: -8px;
            color: var(--footer-text);
        }

        .drop-zone {
            display: block;
            margin: 20px auto 0;
            padding: 24px;
            border: 2px dashed var(--input-border);
            border-radius: 12px;
            cursor: pointer;
            transition: border-color 0.2s, background-color 0.2s;
        }

        .drop-zone:hover,
        .drop-zone.dragover {
            border-color: var(--btn-bg);
            background-color: rgba(61, 139, 253, 0.06);
        }

        .drop-zone input { display: none; }

        .drop-zone img {
            display: none;
            max-width: 100%;
            max-height: 280px;
            margin: 0 auto 12px;
            border-radius: 8px;
        }

        .drop-zone.has-image img { display: block; }

        .ai-status {
            margin: 16px 0 0;
            min-height: 1.2em;
            font-size: 14px;
            color: var(--footer-text);
        }

        .ai-status.error { color: var(--error); }

        .ai-result { display: none; text-align: left; }
        .ai-result.show { display: block; }

        .prob-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 8px 0;
            font-size: 14px;
        }

        .prob-row .label { width: 64px; flex-shrink: 0; }
        .prob-row .pct { width: 48px; text-align: right; flex-shrink: 0; }

        .prob-bar {
            flex: 1;
            height: 12px;
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 6px;
            overflow: hidden;
        }

        .prob-bar span {
            display: block;
            height: 100%;
            background-color: var(--btn-bg);
            transition: width 0.5s;
        }

        .analysis {
            margin: 18px 0 4px;
            padding: 12px 14px;
            border-radius: 8px;
            background-color: var(--input-bg);
            font-size: 14px;
            line-height: 1.5;
        }

        .swatch {
            display: inline-block;
            width: 14px;
            height: 14px;
            margin-right: 4px;
            vertical-align: -2px;
            border-radius: 3px;
            border: 1px solid var(--input-border);
        }

        .rec-title { margin: 22px 0 10px; font-size: 17px; }

        .rec-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
            gap: 12px;
        }

        .rec-card {
            display: block;
            padding: 14px;
            border: 1px solid var(--input-border);
            border-radius: 10px;
            color: var(--text);
            text-decoration: none;
            transition: border-color 0.2s, transform 0.2s;
        }

        .rec-card:hover {
            border-color: var(--btn-bg);
            transform: translateY(-2px);
        }

        .rec-card .emoji { font-size: 28px; }
        .rec-card strong { display: block; margin: 6px 0 4px; }
        .rec-card p { margin: 0; font-size: 13px; color: var(--footer-text); line-height: 1.45; }
        .rec-card .go { display: inline-block; margin-top: 8px; font-size: 12px; color: var(--btn-bg); }

        .comments {
            max-width: 720px;
            margin: 60px auto 0;
            text-align: left;
        }

        .comments h2 {
            text-align: center;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            text-align: center;
            transition: background-color 0.3s, color 0.3s;
        }

        header {
            position: relative;
            background-color: var(--header-bg);
            color: var(--header-text);
            padding: 20px;
        }

        main {
            padding: 50px 20px;
        }

        button {
            background-color: var(--btn-bg);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background-color: var(--btn-hover);
        }

        .theme-toggle {

            top: 50%;
            right: 16px;
            transform: translateY(-50%);
            padding: 8px 14px;
            font-size: 14px;
            background-color: transparent;
            color: var(--header-text);
            border: 1px solid currentColor;
        }

        .theme-toggle:hover {
            background-color: rgba(255, 255, 255, 0.15);
        }

        footer {
            padding: 20px;
            color: var(--footer-text);
        }

        @media (max-width: 480px) {
            header {

            }

            }

        .projects {

        }

        .project-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 18px 12px;
            border-radius: 12px;
            border: 2px solid var(--btn-bg);
            color: var(--text);

            transition: transform 0.15s, background-color 0.15s;
        }

        }

        .project-icon { font-size: 2rem; }
        .project-card b { font-size: 1.1rem; }
        .project-card small { color: var(--footer-text); }
    </style>
</head>

    <script>
        function hello() {
            alert("버튼을 클릭했습니다!");
        }

        function updateToggleLabel() {
            var isDark = document.documentElement.getAttribute("data-theme") === "dark";
            document.getElementById("themeToggle").textContent = isDark ? "☀️ 화이트 모드" : "🌙 다크 모드";
        }

        function toggleTheme() {
            var isDark = document.documentElement.getAttribute("data-theme") === "dark";
            var next = isDark ? "light" : "dark";
            document.documentElement.setAttribute("data-theme", next);
            try { localStorage.setItem("theme", next); } catch (e) {}
            updateToggleLabel();
            // Disqus는 로드 시점의 글자색으로 테마를 정하므로, 테마 변경 시 다시 그림
            // (body 색상 전환 애니메이션 0.3초가 끝난 뒤에 다시 그려야 올바른 색을 읽음)
            if (window.DISQUS) {
                setTimeout(function () {
                    window.DISQUS.reset({ reload: true, config: disqus_config });
                }, 350);
            }
        }

        updateToggleLabel();

        // Disqus 댓글
        // GitHub Pages와 Cloudflare Pages 어느 쪽에서 접속해도 같은 댓글 스레드를 보도록 URL/식별자를 고정
        var disqus_config = function () {
            this.page.url = "https://geniuschoi118.github.io/product-builder/";
            this.page.identifier = "home";
            this.page.title = "나의 웹사이트";
        };

        (function () {
            var d = document, s = d.createElement("script");
            s.src = "https://product-builder-ey1jxegfei.disqus.com/embed.js";
            s.setAttribute("data-timestamp", +new Date());
            (d.head || d.body).appendChild(s);
        })();

        // 제휴 문의 폼: 페이지 이동 없이 Formspree로 전송
        document.getElementById("contactForm").addEventListener("submit", async function (e) {
            e.preventDefault();
            var form = e.target;
            var btn = document.getElementById("submitBtn");
            var status = document.getElementById("formStatus");

            btn.disabled = true;
            btn.textContent = "보내는 중...";
            status.className = "form-status";
            status.textContent = "";

            try {
                var res = await fetch(form.action, {
                    method: "POST",
                    body: new FormData(form),
                    headers: { "Accept": "application/json" }
                });
                if (res.ok) {
                    form.reset();
                    status.classList.add("success");
                    status.textContent = "문의가 접수되었습니다. 감사합니다!";
                } else {
                    var data = await res.json().catch(function () { return {}; });
                    var msg = data.errors ? data.errors.map(function (er) { return er.message; }).join(", ") : "";
                    status.classList.add("error");
                    status.textContent = "전송에 실패했습니다. " + (msg || "잠시 후 다시 시도해주세요.");
                }
            } catch (err) {
                status.classList.add("error");
                status.textContent = "네트워크 오류가 발생했습니다. 잠시 후 다시 시도해주세요.";
            } finally {
                btn.disabled = false;
                btn.textContent = "보내기";
            }
        });
    </script>

            };

            var model = null;
            var modelPromise = null;

            var input = document.getElementById("imageInput");
            var dropZone = document.getElementById("dropZone");
            var preview = document.getElementById("previewImg");
            var dropText = document.getElementById("dropText");
            var status = document.getElementById("aiStatus");
            var result = document.getElementById("aiResult");

            function loadModel() {
                if (!modelPromise) {
                    modelPromise = tmImage.load(MODEL_URL + "model.json", MODEL_URL + "metadata.json")
                        .then(function (m) { model = m; return m; })
                        .catch(function (err) { modelPromise = null; throw err; });
                }
                return modelPromise;
            }

            function setStatus(text, isError) {
                status.textContent = text;
                status.className = "ai-status" + (isError ? " error" : "");
            }

            function shopLink(query) {
                return "https://search.shopping.naver.com/search/all?query=" + encodeURIComponent(query);
            }

            function escapeHtml(str) {
                return String(str).replace(/[&<>"']/g, function (c) {
                    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
                });
            }

            function renderCards(el, items, kind) {
                el.innerHTML = items.map(function (it) {
                    var q = kind === "shirt" && it.n.indexOf("티셔츠") === -1 ? it.n + " 티셔츠" : it.n;
                    return '<a class="rec-card" target="_blank" rel="noopener" href="' + shopLink(q) + '">' +
                        '<span class="emoji">' + it.e + '</span>' +
                        '<strong>' + escapeHtml(it.n) + '</strong>' +
                        '<p>' + escapeHtml(it.d) + '</p>' +
                        '<span class="go">찾아보기 →</span></a>';
                }).join("");
            }

            // --- 사진의 대표 색 분석 (가운데 영역, 너무 밝거나 어두운 배경은 덜 반영) ---
            function analyzeColor(img) {
                var size = 64;
                var canvas = document.createElement("canvas");
                canvas.width = canvas.height = size;
                var ctx = canvas.getContext("2d");
                var w = img.naturalWidth, h = img.naturalHeight;
                var side = Math.min(w, h) * 0.7;
                ctx.drawImage(img, (w - side) / 2, (h - side) / 2, side, side, 0, 0, size, size);
                var data = ctx.getImageData(0, 0, size, size).data;

                var r = 0, g = 0, b = 0, n = 0;
                var hx = 0, hy = 0, sSum = 0, lSum = 0, cn = 0;
                var total = data.length / 4;
                for (var i = 0; i < data.length; i += 4) {
                    var hsl = rgbToHsl(data[i], data[i + 1], data[i + 2]);
                    // 흰 배경(제품 사진 등)은 제외
                    if (hsl.l > 0.9 && hsl.s < 0.3) continue;
                    r += data[i]; g += data[i + 1]; b += data[i + 2]; n++;
                    lSum += hsl.l;
                    if (hsl.s > 0.25 && hsl.l > 0.12 && hsl.l < 0.9) {
                        var rad = hsl.h * Math.PI / 180;
                        hx += Math.cos(rad) * hsl.s; hy += Math.sin(rad) * hsl.s;
                        sSum += hsl.s; cn++;
                    }
                }
                // 거의 전부 흰색이면 흰 물체로 판단
                if (n < total * 0.1) {
                    return { avg: { r: 245, g: 245, b: 245 }, hue: 0, colorfulRatio: 0, sat: 0, light: 0.95 };
                }
                var avg = { r: Math.round(r / n), g: Math.round(g / n), b: Math.round(b / n) };
                var hue = (Math.atan2(hy, hx) * 180 / Math.PI + 360) % 360;
                return {
                    avg: avg,
                    hue: hue,
                    colorfulRatio: cn / n,        // 채도 있는 픽셀 비율
                    sat: cn ? sSum / cn : 0,
                    light: lSum / n
                };
            }

            function rgbToHsl(r, g, b) {
                r /= 255; g /= 255; b /= 255;
                var max = Math.max(r, g, b), min = Math.min(r, g, b);
                var l = (max + min) / 2, h = 0, s = 0;
                if (max !== min) {
                    var d = max - min;
                    s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                    if (max === r) h = ((g - b) / d + (g < b ? 6 : 0));
                    else if (max === g) h = (b - r) / d + 2;
                    else h = (r - g) / d + 4;
                    h *= 60;
                }
                return { h: h, s: s, l: l };
            }

            function tteokProfile(c) {
                if (c.light < 0.3) return "dark";
                if (c.colorfulRatio < 0.3) return "mild";
                var reddish = c.hue >= 340 || c.hue < 18;
                if (reddish && c.light < 0.55) return "spicy";
                if (c.hue >= 18 && c.hue < 50 && c.light < 0.4) return "dark";
                if (reddish || (c.hue >= 18 && c.hue < 45) || c.hue >= 300) return c.light >= 0.5 ? "rose" : "spicy";
                return "mild";
            }

            function shirtColorName(c) {
                if (c.colorfulRatio < 0.25) {
                    if (c.light > 0.72) return "흰색";
                    if (c.light < 0.28) return "검정";
                    return "회색";
                }
                var h = c.hue;
                if (h >= 20 && h < 45 && c.light < 0.4) return "갈색";
                if (h >= 20 && h < 50 && c.sat < 0.45 && c.light >= 0.4) return "베이지";
                if (h < 15 || h >= 345) return c.light > 0.65 ? "분홍" : "빨강";
                if (h < 40) return "주황";
                if (h < 70) return "노랑";
                if (h < 170) return "초록";
                if (h < 205) return "하늘";
                if (h < 245) return c.light < 0.35 ? "남색" : "파랑";
                if (h < 290) return "보라";
                return "분홍";
            }

            function shirtToTteok(color) {
                if (color === "흰색" || color === "베이지" || color === "하늘" || color === "노랑") {
                    return { msg: "밝은 티셔츠엔 빨간 국물은 위험해요! 튀어도 덜 티 나는 메뉴로", items: TTEOK.mild.items.slice(0, 2) };
                }
                if (color === "검정" || color === "남색" || color === "빨강" || color === "갈색") {
                    return { msg: "어두운/붉은 티셔츠라면 국물 걱정 없이 마음껏!", items: TTEOK.spicy.items.slice(0, 2) };
                }
                return { msg: "적당한 톤의 티셔츠엔 부드러운 로제가 딱", items: TTEOK.rose.items.slice(0, 2) };
            }

            function renderProbs(preds) {
                document.getElementById("probList").innerHTML = preds.map(function (p) {
                    var pct = Math.round(p.probability * 100);
                    return '<div class="prob-row"><span class="label">' + escapeHtml(p.className) + '</span>' +
                        '<div class="prob-bar"><span style="width:' + pct + '%"></span></div>' +
                        '<span class="pct">' + pct + '%</span></div>';
                }).join("");
            }

            function swatch(c) {
                return '<span class="swatch" style="background:rgb(' + c.avg.r + ',' + c.avg.g + ',' + c.avg.b + ')"></span>';
            }

            function showRecommendations(top, color) {
                var analysis = document.getElementById("analysis");
                var recTitle = document.getElementById("recTitle");
                var pairTitle = document.getElementById("pairTitle");
                var recGrid = document.getElementById("recGrid");
                var pairGrid = document.getElementById("pairGrid");

                if (top.className === "떡볶이") {
                    var key = tteokProfile(color);
                    var prof = TTEOK[key];
                    analysis.innerHTML = "🍢 <b>떡볶이</b>로 보여요! " + swatch(color) + "사진 색감 분석: " + prof.tag;
                    recTitle.textContent = "이런 떡볶이는 어때요?";
                    renderCards(recGrid, prof.items, "tteok");
                    pairTitle.textContent = "이 떡볶이 먹을 때 입기 좋은 티셔츠";
                    renderCards(pairGrid, TTEOK_TO_SHIRT[key], "shirt");
                } else {
                    var name = shirtColorName(color);
                    var matches = SHIRT_MATCH[name] || ["화이트", "블랙", "그레이"];
                    analysis.innerHTML = "👕 <b>티셔츠</b>로 보여요! " + swatch(color) + "사진 속 티셔츠 색: <b>" + name + "</b> 계열";
                    recTitle.textContent = name + " 티셔츠와 함께 갖추면 좋은 티셔츠";
                    renderCards(recGrid, matches.map(function (m, i) {
                        var desc = i === 0 ? name + " 티셔츠와 번갈아 입기 좋은 조합이에요." :
                                   i === 1 ? "레이어드하거나 돌려 입기 좋은 색." : "옷장에 있으면 든든한 기본템.";
                        return { e: "👕", n: m + " 티셔츠", d: desc };
                    }), "shirt");
                    var pair = shirtToTteok(name);
                    pairTitle.textContent = "이 티셔츠 입고 먹기 좋은 떡볶이";
                    renderCards(pairGrid, pair.items.map(function (it, i) {
                        return i === 0 ? { e: it.e, n: it.n, d: pair.msg } : it;
                    }), "tteok");
                }
            }

            async function handleFile(file) {
                if (!file || !file.type.startsWith("image/")) {
                    setStatus("이미지 파일을 선택해주세요.", true);
                    return;
                }
                result.classList.remove("show");
                if (preview.src) URL.revokeObjectURL(preview.src);
                preview.src = URL.createObjectURL(file);
                dropZone.classList.add("has-image");
                dropText.textContent = "다른 사진으로 바꾸려면 클릭하세요";

                try {
                    await preview.decode();
                    setStatus(model ? "분석 중..." : "AI 모델을 불러오는 중... (처음 한 번만 몇 초 걸려요)");
                    await loadModel();
                    setStatus("분석 중...");

                    var preds = await model.predict(preview);
                    preds.sort(function (a, b) { return b.probability - a.probability; });
                    renderProbs(preds);

                    var top = preds[0];
                    if (top.probability < CONFIDENCE_MIN) {
                        document.getElementById("analysis").innerHTML =
                            "🤔 떡볶이인지 티셔츠인지 확실하지 않아요. 떡볶이나 티셔츠가 잘 보이는 사진으로 다시 시도해주세요.";
                        ["recTitle", "pairTitle"].forEach(function (id) { document.getElementById(id).textContent = ""; });
                        ["recGrid", "pairGrid"].forEach(function (id) { document.getElementById(id).innerHTML = ""; });
                    } else {
                        showRecommendations(top, analyzeColor(preview));
                    }
                    result.classList.add("show");
                    setStatus("");
                } catch (err) {
                    console.error(err);
                    setStatus("분석에 실패했어요. 인터넷 연결을 확인하고 다시 시도해주세요.", true);
                }
            }

            input.addEventListener("change", function () { handleFile(input.files[0]); input.value = ""; });

            ["dragenter", "dragover"].forEach(function (ev) {
                dropZone.addEventListener(ev, function (e) { e.preventDefault(); dropZone.classList.add("dragover"); });
            });
            ["dragleave", "drop"].forEach(function (ev) {
                dropZone.addEventListener(ev, function (e) { e.preventDefault(); dropZone.classList.remove("dragover"); });
            });
            dropZone.addEventListener("drop", function (e) { handleFile(e.dataTransfer.files[0]); });
        })();
    </script>

</body>

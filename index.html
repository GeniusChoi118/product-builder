<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 첫 웹사이트</title>

    <script>
        // 깜빡임 방지: 화면 그리기 전에 저장된 테마 적용
        (function () {
            var saved = null;
            try { saved = localStorage.getItem("theme"); } catch (e) {}
            var theme = saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
            document.documentElement.setAttribute("data-theme", theme);
        })();
    </script>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --bg: #f4f4f4;
            --text: #333;
            --header-bg: #333;
            --header-text: #fff;
            --footer-text: #777;
            --btn-bg: #007bff;
            --btn-hover: #0056b3;
        }

        [data-theme="dark"] {
            --bg: #121212;
            --text: #e6e6e6;
            --header-bg: #1f1f1f;
            --header-text: #fff;
            --footer-text: #999;
            --btn-bg: #3d8bfd;
            --btn-hover: #6ea8fe;
            --card-bg: #1e1e1e;
            --input-bg: #2a2a2a;
            --input-border: #444;
            --success: #75b798;
            --error: #ea868f;
        }

        :root:not([data-theme="dark"]) {
            --card-bg: #fff;
            --input-bg: #fff;
            --input-border: #ccc;
            --success: #198754;
            --error: #dc3545;
        }

        .contact {
            max-width: 480px;
            margin: 60px auto 0;
            padding: 28px 24px;
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            text-align: left;
        }

        .contact h2 {
            margin-top: 0;
            text-align: center;
        }

        .contact .desc {
            text-align: center;
            margin-top: -8px;
            color: var(--footer-text);
        }

        .contact label {
            display: block;
            margin: 16px 0 6px;
            font-weight: bold;
            font-size: 14px;
        }

        .contact input,
        .contact textarea {
            width: 100%;
            padding: 10px 12px;
            font-size: 15px;
            font-family: inherit;
            color: var(--text);
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 8px;
        }

        .contact input:focus,
        .contact textarea:focus {
            outline: 2px solid var(--btn-bg);
            outline-offset: 1px;
        }

        .contact textarea {
            min-height: 120px;
            resize: vertical;
        }

        .contact button[type="submit"] {
            width: 100%;
            margin-top: 20px;
            font-size: 16px;
        }

        .contact button[disabled] {
            opacity: 0.6;
            cursor: wait;
        }

        .form-status {
            margin: 14px 0 0;
            text-align: center;
            font-size: 14px;
            min-height: 1.2em;
        }

        .form-status.success { color: var(--success); }
        .form-status.error { color: var(--error); }

        .hp { position: absolute; left: -9999px; }

        .comments {
            max-width: 720px;
            margin: 60px auto 0;
            text-align: left;
        }

        .comments h2 {
            text-align: center;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            text-align: center;
            transition: background-color 0.3s, color 0.3s;
        }

        header {
            position: relative;
            background-color: var(--header-bg);
            color: var(--header-text);
            padding: 20px;
        }

        main {
            padding: 50px 20px;
        }

        button {
            background-color: var(--btn-bg);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background-color: var(--btn-hover);
        }

        .theme-toggle {
            position: absolute;
            top: 50%;
            right: 16px;
            transform: translateY(-50%);
            padding: 8px 14px;
            font-size: 14px;
            background-color: transparent;
            color: var(--header-text);
            border: 1px solid currentColor;
        }

        .theme-toggle:hover {
            background-color: rgba(255, 255, 255, 0.15);
        }

        footer {
            padding: 20px;
            color: var(--footer-text);
        }

        @media (max-width: 480px) {
            header {
                padding-top: 60px;
            }
            .theme-toggle {
                top: 16px;
                transform: none;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>나의 웹사이트</h1>
        <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()"></button>
    </header>

    <main>
        <h2>안녕하세요!</h2>
        <p>최원석입니다.</p>

        <button onclick="hello()">
            클릭하기
        </button>

        <section class="contact" id="contact">
            <h2>제휴 문의</h2>
            <p class="desc">제휴·협업 제안을 남겨주시면 이메일로 답변드릴게요.</p>

            <form id="contactForm" action="https://formspree.io/f/myeweoae" method="POST">
                <label for="name">이름 / 담당자명 *</label>
                <input type="text" id="name" name="name" required>

                <label for="email">이메일 *</label>
                <input type="email" id="email" name="email" required>

                <label for="company">회사 / 단체명</label>
                <input type="text" id="company" name="company">

                <label for="message">문의 내용 *</label>
                <textarea id="message" name="message" required></textarea>

                <input type="hidden" name="_subject" value="[웹사이트] 새 제휴 문의">
                <input type="text" name="_gotcha" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">

                <button type="submit" id="submitBtn">보내기</button>
                <p class="form-status" id="formStatus" role="status"></p>
            </form>
        </section>

        <section class="comments" id="comments">
            <h2>댓글</h2>
            <div id="disqus_thread"></div>
            <noscript>Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a></noscript>
        </section>
    </main>

    <footer>
        <p>© 2026 My Website</p>
    </footer>

    <script>
        function hello() {
            alert("버튼을 클릭했습니다!");
        }

        function updateToggleLabel() {
            var isDark = document.documentElement.getAttribute("data-theme") === "dark";
            document.getElementById("themeToggle").textContent = isDark ? "☀️ 화이트 모드" : "🌙 다크 모드";
        }

        function toggleTheme() {
            var isDark = document.documentElement.getAttribute("data-theme") === "dark";
            var next = isDark ? "light" : "dark";
            document.documentElement.setAttribute("data-theme", next);
            try { localStorage.setItem("theme", next); } catch (e) {}
            updateToggleLabel();
            // Disqus는 로드 시점의 글자색으로 테마를 정하므로, 테마 변경 시 다시 그림
            // (body 색상 전환 애니메이션 0.3초가 끝난 뒤에 다시 그려야 올바른 색을 읽음)
            if (window.DISQUS) {
                setTimeout(function () {
                    window.DISQUS.reset({ reload: true, config: disqus_config });
                }, 350);
            }
        }

        updateToggleLabel();

        // Disqus 댓글
        // GitHub Pages와 Cloudflare Pages 어느 쪽에서 접속해도 같은 댓글 스레드를 보도록 URL/식별자를 고정
        var disqus_config = function () {
            this.page.url = "https://geniuschoi118.github.io/product-builder/";
            this.page.identifier = "home";
            this.page.title = "나의 웹사이트";
        };

        (function () {
            var d = document, s = d.createElement("script");
            s.src = "https://product-builder-ey1jxegfei.disqus.com/embed.js";
            s.setAttribute("data-timestamp", +new Date());
            (d.head || d.body).appendChild(s);
        })();

        // 제휴 문의 폼: 페이지 이동 없이 Formspree로 전송
        document.getElementById("contactForm").addEventListener("submit", async function (e) {
            e.preventDefault();
            var form = e.target;
            var btn = document.getElementById("submitBtn");
            var status = document.getElementById("formStatus");

            btn.disabled = true;
            btn.textContent = "보내는 중...";
            status.className = "form-status";
            status.textContent = "";

            try {
                var res = await fetch(form.action, {
                    method: "POST",
                    body: new FormData(form),
                    headers: { "Accept": "application/json" }
                });
                if (res.ok) {
                    form.reset();
                    status.classList.add("success");
                    status.textContent = "문의가 접수되었습니다. 감사합니다!";
                } else {
                    var data = await res.json().catch(function () { return {}; });
                    var msg = data.errors ? data.errors.map(function (er) { return er.message; }).join(", ") : "";
                    status.classList.add("error");
                    status.textContent = "전송에 실패했습니다. " + (msg || "잠시 후 다시 시도해주세요.");
                }
            } catch (err) {
                status.classList.add("error");
                status.textContent = "네트워크 오류가 발생했습니다. 잠시 후 다시 시도해주세요.";
            } finally {
                btn.disabled = false;
                btn.textContent = "보내기";
            }
        });
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>상벌점 관리</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🏫 상벌점 관리</h1>
    <div class="header-actions">
      <button id="exportBtn" class="ghost">백업 저장</button>
      <label class="ghost file-label">
        백업 불러오기
        <input type="file" id="importInput" accept="application/json" hidden>
      </label>
    </div>
  </header>

  <main>
    <!-- 학생 추가 -->
    <section class="card">
      <h2>학생 추가</h2>
      <form id="addStudentForm" class="row">
        <input type="number" id="studentNo" placeholder="번호" min="1" required>
        <input type="text" id="studentName" placeholder="이름" required>
        <button type="submit">추가</button>
      </form>
    </section>

    <!-- 점수 주기 -->
    <section class="card">
      <h2>점수 주기</h2>
      <form id="pointForm" class="row wrap">
        <select id="pointStudent" required>
          <option value="">학생 선택</option>
        </select>
        <select id="pointType">
          <option value="merit">상점 👍</option>
          <option value="demerit">벌점 👎</option>
        </select>
        <input type="number" id="pointAmount" value="1" min="1" max="100" required>
        <input type="text" id="pointReason" placeholder="사유 (예: 청소 도움, 지각)" list="reasonList">
        <datalist id="reasonList">
          <option value="수업 태도 우수">
          <option value="친구 도움">
          <option value="청소 봉사">
          <option value="과제 우수">
          <option value="지각">
          <option value="과제 미제출">
          <option value="수업 방해">
        </datalist>
        <button type="submit">주기</button>
      </form>
    </section>

    <!-- 학생 목록 -->
    <section class="card">
      <div class="section-head">
        <h2>학생 목록</h2>
        <select id="sortSelect">
          <option value="no">번호순</option>
          <option value="total">합계 높은 순</option>
          <option value="merit">상점 많은 순</option>
          <option value="demerit">벌점 많은 순</option>
        </select>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>번호</th>
              <th>이름</th>
              <th>상점</th>
              <th>벌점</th>
              <th>합계</th>
              <th>빠른 점수</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="studentTable"></tbody>
        </table>
      </div>
      <p id="emptyMsg" class="empty">아직 학생이 없어요. 위에서 학생을 추가해 주세요.</p>
    </section>

    <!-- 기록 -->
    <section class="card">
      <div class="section-head">
        <h2>최근 기록</h2>
        <button id="clearHistoryBtn" class="danger small">기록 전체 삭제</button>
      </div>
      <ul id="historyList"></ul>
      <p id="emptyHistory" class="empty">아직 기록이 없어요.</p>
    </section>
  </main>

  <footer>
    <p>데이터는 이 브라우저에 저장돼요. 다른 컴퓨터로 옮기려면 "백업 저장"을 이용하세요.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
